name: Codex macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/commit-view-split-diff

jobs:
  build-macos-aarch64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: zed-macos-aarch64-debug-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            zed-macos-aarch64-debug-${{ runner.os }}-

      - name: Install CMake
        run: brew install cmake

      - name: Install Cargo Bundle
        run: |
          cargo install cargo-bundle \
            --git https://github.com/zed-industries/cargo-bundle.git \
            --branch zed-deploy

      - name: Build debug app bundle
        run: |
          set -euo pipefail

          target_triple="aarch64-apple-darwin"
          channel="$(cat crates/zed/RELEASE_CHANNEL)"

          script/generate-licenses
          rustup target add "$target_triple"

          cargo build --package zed --package cli --target "$target_triple"

          pushd crates/zed
          cp Cargo.toml Cargo.toml.backup
          sed -i.backup "s/package.metadata.bundle-${channel}/package.metadata.bundle/" Cargo.toml
          app_path="$(cargo bundle --target "$target_triple" --select-workspace-root | xargs)"
          mv Cargo.toml.backup Cargo.toml
          popd

          cp "target/${target_triple}/debug/zed" "${app_path}/Contents/MacOS/zed"
          cp "target/${target_triple}/debug/cli" "${app_path}/Contents/MacOS/cli"

          mkdir -p "${app_path}/Contents/Frameworks"
          tmp_dir="$(mktemp -d)"
          curl --silent --fail --location \
            "https://github.com/desktop/dugite-native/releases/download/v2.43.3/dugite-native-v2.43.3-fa29823-macOS-arm64.tar.gz" \
            | tar -xz -C "$tmp_dir" -f - bin/git
          mv "${tmp_dir}/bin/git" "${app_path}/Contents/MacOS/git"
          rm -rf "$tmp_dir"

          document_icon_source="crates/zed/resources/Document.icns"
          document_icon_target="${app_path}/Contents/Resources/Document.icns"
          if [[ -f "${document_icon_source}" ]]; then
            mkdir -p "$(dirname "${document_icon_target}")"
            cp "${document_icon_source}" "${document_icon_target}"
          fi

          cp "crates/zed/contents/${channel}/embedded.provisionprofile" "${app_path}/Contents/"
          cat crates/zed/resources/zed.entitlements \
            | sed '/com.apple.developer.associated-domains/,+1d' \
            > "${app_path}/Contents/Resources/zed.entitlements"
          codesign --force --deep \
            --entitlements "${app_path}/Contents/Resources/zed.entitlements" \
            --sign - \
            "${app_path}" \
            -v

          ditto -c -k --keepParent "${app_path}" target/Zed-debug-aarch64-app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Zed-debug-aarch64-app
          path: target/Zed-debug-aarch64-app.zip
          if-no-files-found: error
